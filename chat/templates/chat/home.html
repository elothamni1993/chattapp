<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
        }
        #chat-log {
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            padding: 1rem;
        }
        .message-bubble {
            max-width: 75%;
            padding: 0.75rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }
        .from-me {
            background-color: #0d6efd;
            color: white;
            align-self: flex-end;
            text-align: end;
        }
        .from-others {
            background-color: #e9ecef;
            color: #212529;
            align-self: flex-start;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .message-container {
            display: flex;
            align-items: flex-start;
        }
        .from-me .message-container {
            flex-direction: row-reverse;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="fw-bold">💬 Chat Application</h1>
        <p class="text-muted">Hello, {{ user.username }}!</p>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Logout</button>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Chat Room</h5>
        </div>
        <div id="chat-log" class="card-body d-flex flex-column-reverse">
            {% for message in messages reversed %}
                {% with avatar_url="https://api.dicebear.com/7.x/initials/svg?seed="|add:message.user.username %}
                <div class="d-flex mb-2 {% if message.user == user %}justify-content-end{% else %}justify-content-start{% endif %}">
                    <div class="message-container">
                        <img src="{{ avatar_url }}" alt="avatar" class="avatar">
                        <div class="message-bubble {% if message.user == user %}from-me{% else %}from-others{% endif %}">
                            <small class="fw-bold d-block">{{ message.user.username }}</small>
                            {{ message.content|safe }}
                        </div>
                    </div>
                </div>
                {% endwith %}
            {% endfor %}
        </div>
        <div class="card-footer d-flex">
            <input id="chat-message-input" type="text" class="form-control me-2" placeholder="Type a message 😊..." autocomplete="off">
            <button id="chat-message-submit" class="btn btn-success">Send</button>
        </div>
    </div>
</div>

<script>
    const chatSocket = new WebSocket('ws://' + window.location.host + '/ws/chat/');

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const chatLog = document.getElementById('chat-log');
        const isCurrentUser = data.user === "{{ user.username }}";
        const bubbleClass = isCurrentUser ? 'from-me' : 'from-others';
        const justifyClass = isCurrentUser ? 'justify-content-end' : 'justify-content-start';
        const avatarURL = `https://api.dicebear.com/7.x/initials/svg?seed=${data.user}`;

        const bubble = `
            <div class="d-flex mb-2 ${justifyClass}">
                <div class="message-container">
                    <img src="${avatarURL}" alt="avatar" class="avatar">
                    <div class="message-bubble ${bubbleClass}">
                        <small class="fw-bold d-block">${data.user}</small>
                        ${data.message}
                    </div>
                </div>
            </div>
        `;

        chatLog.innerHTML = bubble + chatLog.innerHTML;
    };

    document.getElementById('chat-message-submit').onclick = function() {
        const input = document.getElementById('chat-message-input');
        const message = input.value;
        if (message.trim() !== '') {
            chatSocket.send(JSON.stringify({ 'message': message }));
            input.value = '';
        }
    };
</script>

</body>
</html>
